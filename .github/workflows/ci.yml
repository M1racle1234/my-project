name: Security CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static analysis (Ruff)
        run: ruff check .

      - name: Unit and security tests
        run: pytest -q
        env:
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef

  sast:
    name: SAST (Bandit)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Bandit
        run: bandit -r app -f txt -o bandit-report.txt

      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo "## Bandit SAST report"
            echo '```'
            cat bandit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: warn

  sca:
    name: SCA (pip-audit)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Audit dependencies (console)
        run: pip-audit -r requirements.txt --desc

      - name: Audit dependencies (JSON report)
        run: pip-audit -r requirements.txt --desc --format json -o pip-audit-report.json

      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo "## pip-audit SCA report"
            echo '```json'
            cat pip-audit-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn
